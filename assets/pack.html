<title>Decision Pack</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--DP_LOCAL-->
<style>
:root{
  --bg:#f5f6f4; --surface:#ffffff; --raised:#fbfbfa; --fg:#18201c; --muted:#5b655f; --line:#dbe0dc;
  --accent:#1d6b50; --accent-fg:#ffffff; --accent-soft:#e2f0e9; --warn:#8f5400; --warn-soft:#fbefd9;
  --bad:#a12f29; --bad-soft:#f8e3e1; --mark:#e5484d; --focus:#2463eb; --shadow:0 1px 2px rgba(0,0,0,.06);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#191f1c; --raised:#1e2521; --fg:#e7ece9; --muted:#9ba69f; --line:#2d3632;
  --accent:#5cc196; --accent-fg:#0d1a14; --accent-soft:#1b3328; --warn:#e3a54b; --warn-soft:#352914;
  --bad:#ee8c85; --bad-soft:#3a1f1d; --focus:#7aa7ff; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191f1c; --raised:#1e2521; --fg:#e7ece9; --muted:#9ba69f; --line:#2d3632;
  --accent:#5cc196; --accent-fg:#0d1a14; --accent-soft:#1b3328; --warn:#e3a54b; --warn-soft:#352914;
  --bad:#ee8c85; --bad-soft:#3a1f1d; --focus:#7aa7ff; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.5 var(--font);padding:0 max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.toprow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;justify-content:space-between}
.toprow h1{font-size:1.15rem}
.counts{font-size:.9rem;color:var(--muted)}
.next{font-size:.85rem;color:var(--warn)}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px;min-width:0;max-width:100%}
.strip a{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);text-decoration:none;font:500 .82rem var(--mono)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dot.decided{background:var(--accent)} .dot.saved{background:var(--focus)} .dot.moot{background:var(--muted)}
.takeall{align-self:flex-start;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:600}
.banner{border-radius:8px;padding:10px 14px;background:var(--warn-soft);color:var(--fg);font-size:.92rem}
.banner.err{background:var(--bad-soft)}

/* sections */
details.done{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.done summary{cursor:pointer;font-weight:600;min-height:28px}
details.done li{margin:6px 0;font-size:.92rem}
ul.plain{margin:6px 0 0;padding-left:1.1em}

/* card */
article.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;display:grid;gap:14px;min-width:0;scroll-margin-top:150px}
article.card.hl{outline:3px solid var(--focus);outline-offset:2px}
.cardtop{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;min-height:26px;padding:0 9px;border-radius:999px;font:500 .78rem var(--mono);background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.chip.easy{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.hard{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.tap{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.saved{background:var(--accent-soft);border-color:transparent}
.q{font-size:1.2rem;font-weight:700}
.pick{font-weight:600}
.maybe{border-left:3px solid var(--warn);padding:6px 10px;background:var(--warn-soft);border-radius:0 8px 8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pic{display:flex;flex-direction:column;gap:8px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{min-height:36px;min-width:44px;padding:0 12px;border:0;background:var(--surface);font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ptbtn{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.85rem}
.ptbtn[aria-pressed="true"]{background:var(--focus);color:#fff;border-color:var(--focus)}
.frame{position:relative;width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--raised);touch-action:manipulation}
.frame img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.frame.pointing{cursor:crosshair;touch-action:none}
.frame .lbl{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.66);color:#fff;font:600 .72rem var(--mono);padding:3px 7px;border-radius:6px;pointer-events:none}
.hot{position:absolute;border:0;padding:0;background:transparent;border-radius:6px}
.hot::before{content:"";position:absolute;inset:0}
.hot.small::before{inset:-14px}
.hot:hover,.hot:focus-visible,.hot.on{background:rgba(229,72,77,.18);box-shadow:inset 0 0 0 2px var(--mark)}
.mark{position:absolute;border:2px dashed var(--focus);background:rgba(36,99,235,.12);border-radius:4px;pointer-events:none}
.mark.pin{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--focus);border:2px solid #fff}
.legend{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:.92rem}
.legend li{display:flex;gap:8px;align-items:flex-start}
.legend b{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--mark);color:#fff;font-size:.75rem}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;min-height:56px;width:100%;text-align:left;padding:6px 10px 6px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.opt img,.opt .noimg{width:56px;height:40px;object-fit:cover;object-position:top left;border-radius:6px;border:1px solid var(--line);background:var(--raised)}
.opt .b{font-weight:700}
.opt .r{display:block;font-size:.85rem;color:var(--muted)}
.opt .u{display:block;margin-top:2px;font:500 .72rem var(--mono);color:var(--muted)}
.opt.rec{border-color:var(--accent);background:var(--accent-soft)}
.opt.rec .u::before{content:"My pick · ";color:var(--accent);font-weight:700}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.opt[aria-pressed="true"] .b::after{content:"  ✓ your answer";color:var(--accent);font-size:.8rem}
.alts{display:flex;flex-wrap:wrap;gap:8px}
.alts button{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.9rem}
.alts button[aria-pressed="true"]{border-color:var(--focus);box-shadow:inset 0 0 0 2px var(--focus)}
.note{display:grid;gap:8px}
.note label{font-weight:600;font-size:.92rem}
.note textarea{width:100%;min-height:76px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--raised);resize:vertical}
.regions{display:flex;flex-wrap:wrap;gap:6px}
.rchip{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 4px 0 10px;border-radius:999px;background:var(--accent-soft);font-size:.82rem}
.rchip button{min-width:32px;min-height:32px;border:0;background:transparent;border-radius:50%}
.uploads{display:flex;gap:6px;flex-wrap:wrap}
.uploads img{width:64px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px}
.rowbtns button,.rowbtns label.file{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.88rem;display:inline-flex;align-items:center}
.rowbtns label.file input{position:absolute;opacity:0;width:1px;height:1px}
details.more summary{cursor:pointer;min-height:32px;color:var(--muted);font-size:.9rem}
details.more dl{margin:8px 0 0;display:grid;gap:6px;font-size:.9rem}
details.more dt{font-weight:600}
details.more dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.decidedline{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.decidedline img{width:72px;height:52px;object-fit:cover;object-position:top left;border-radius:6px;border:1px solid var(--line)}
.decidedline .r{font-size:.88rem;color:var(--muted)}
.changebtn{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);justify-self:start}
.status{font-size:.85rem;color:var(--accent)}
.status.err{color:var(--bad)}
section h2{font-size:1rem;margin:8px 0}
.fyi figure{margin:0 0 16px;display:grid;gap:6px}
.fyi img{width:100%;border:1px solid var(--line);border-radius:8px}
.skel{height:220px;border-radius:12px;background:linear-gradient(90deg,var(--surface),var(--raised),var(--surface));background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* send bar */
.sendbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sendbar button{min-height:48px;padding:0 18px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;flex-direction:column}
.lb .bar{display:flex;gap:8px;justify-content:flex-end;padding:8px 12px;flex-wrap:wrap}
.lb .bar a,.lb .bar button{min-height:44px;display:inline-flex;align-items:center;padding:0 14px;border-radius:8px;background:#fff;color:#111;border:0;text-decoration:none;font-weight:600}
.lb .scroll{flex:1;overflow:auto;touch-action:pinch-zoom pan-x pan-y;-webkit-overflow-scrolling:touch}
.lb img{display:block;width:100%;max-width:none;height:auto}
.lb.z2 img{width:200%}
.lb.z1 img{width:auto}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet .panel{width:100%;max-width:560px;max-height:85vh;overflow:auto;background:var(--surface);color:var(--fg);border-radius:14px;padding:18px;display:grid;gap:12px}
.sheet h2{font-size:1.1rem}
.sheet .rowbtns button{min-height:48px;padding:0 18px}
.sheet .rowbtns .primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
@media (min-width:700px){.sheet{align-items:center}}

@media (min-width:900px){
  article.card.open{grid-template-columns:minmax(0,3fr) minmax(0,2fr);column-gap:24px;align-items:start}
  article.card.open .pic{grid-column:1;grid-row:1 / span 20}
  article.card.open > :not(.pic){grid-column:2}
  .q{font-size:1.3rem}
}
</style>

<div class="wrap" id="app">
  <header class="top" id="top">
    <div class="toprow"><h1 id="ptitle">Decisions</h1><span class="counts" id="counts">Loading…</span></div>
    <div class="next" id="next"></div>
    <nav class="strip" id="strip" aria-label="Decisions in this pack"></nav>
    <button class="takeall" id="takeall" hidden></button>
  </header>
  <div id="banners"></div>
  <div id="done"></div>
  <main id="cards" aria-live="polite"><div class="skel"></div><div class="skel" style="margin-top:16px"></div></main>
  <section id="fyi" class="fyi" hidden><h2>For your info</h2><div id="fyilist"></div></section>
  <section id="log" hidden><h2>Decided</h2><div id="loglist"></div></section>
</div>
<div class="sendbar" id="sendbar" hidden><span id="sendtext"></span><button id="sendbtn" type="button">Send to Claude</button></div>

<script>
(function(){
"use strict";
var TIMEOUT = window.DP_TIMEOUT_MS || 10000;
var S = {meta:null, decisions:{}, responses:{}, loaded:false, readOnly:true, db:null, user:null, uid:null,
  comments:null, canSend:"off", ca:null, assets:null, view:{}, pointing:null, drag:null, saving:{}, threads:[],
  sendAnchor:null, sentNote:null, errors:{}};

function h(tag, attrs){
  var el = document.createElement(tag);
  if (attrs) for (var k in attrs){
    var v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "text") el.textContent = v;
    else if (k === "on") for (var e in v) el.addEventListener(e, v[e]);
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (var i = 2; i < arguments.length; i++){
    var c = arguments[i];
    if (c == null || c === false) continue;
    if (Array.isArray(c)) c.forEach(function(x){ if (x != null && x !== false) el.appendChild(typeof x === "string" ? document.createTextNode(x) : x); });
    else el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return el;
}
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){ return null; } }
function lt(iso){
  if (!iso) return "";
  try {
    var d = new Date(iso), o = {weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"};
    var tz = S.meta && S.meta.timezone;
    if (tz) o.timeZone = tz;
    var p; try { p = new Intl.DateTimeFormat("en-US", o).formatToParts(d); } catch(e){ delete o.timeZone; p = new Intl.DateTimeFormat("en-US", o).formatToParts(d); }
    var g = {}; p.forEach(function(x){ g[x.type] = x.value; });
    return g.weekday + " " + g.month + " " + g.day + " " + g.hour + ":" + g.minute + " " + (g.dayPeriod || "") + " " + (g.timeZoneName || "");
  } catch(e){ return iso; }
}
function ltTime(iso){ var s = lt(iso); var m = s.match(/(\d+:\d+ [AP]M \S+)$/); return m ? m[1] : s; }
/* Time labels: `*_local`; packs written before the rename carry `*_ct`. */
function tl(o, k){ return o ? (o[k + "_local"] || o[k + "_ct"] || "") : ""; }
function list(){ return Object.keys(S.decisions).map(function(k){ return S.decisions[k]; }).sort(function(a,b){ return (a.order||0)-(b.order||0) || (a.id < b.id ? -1 : 1); }); }
function rec(d){ return (d.options||[]).filter(function(o){ return o.recommended; })[0] || (d.options||[])[0]; }
function opt(d,k){ return (d.options||[]).filter(function(o){ return o.key === k; })[0]; }
function isOpen(d){ return d.status === "open" || d.status === "needs_material"; }
function resp(d){ var r = S.responses[d.id]; return r && (r.decision_version||1) === (d.version||1) ? r : null; }
function unsynced(d){ var r = resp(d); return r && r.answered_at && (!d.synced_answer_at || r.answered_at > d.synced_answer_at) ? r : null; }
function unsent(){ return list().filter(function(d){ var r = unsynced(d); return r && !r.sent_at && hasAnswer(r); }); }
function hasAnswer(r){ return !!(r.choice_key || (r.note && r.note.trim()) || (r.regions||[]).length || (r.asset_ids||[]).length || r.kind === "material" || r.kind === "yes_that_stands"); }
function shotsFor(d, key){
  var o = key ? opt(d, key) : null;
  var s = (o && o.shots && o.shots.length) ? o.shots : (d.shots || []);
  if (!s.length){ (d.options||[]).some(function(x){ if (x.shots && x.shots.length){ s = x.shots; return true; } }); }
  return s;
}
function thumb(d, key){ var s = shotsFor(d, key); var w = s.filter(function(x){ return x.width === 1440; })[0] || s[0]; return w ? w.src : null; }

/* ---------- writes ---------- */
function baseResp(d){
  var r = resp(d) || {};
  return {decision_id:d.id, decision_version:d.version||1, kind:r.kind||null, choice_key:r.choice_key||null,
    choice_label:r.choice_label||null, was_recommended:!!r.was_recommended, note:r.note||"",
    regions:(r.regions||[]).slice(), asset_ids:(r.asset_ids||[]).slice(), source:"page",
    answered_by:S.uid, answered_at:null, answered_at_local:null, sent_at:null};
}
function save(d, patch){
  if (S.readOnly || !S.db) return Promise.resolve();
  var doc = Object.assign(baseResp(d), patch);
  var now = new Date().toISOString();
  doc.answered_at = now; doc.answered_at_local = lt(now); doc.sent_at = null; doc.answered_by = S.uid;
  S.responses[d.id] = doc;
  var prev = S.saving[d.id] || Promise.resolve();
  S.saving[d.id] = prev.then(function(){
    return S.db.doc("responses/" + d.id).set(doc).then(function(){ delete S.errors[d.id]; }, function(e){
      S.errors[d.id] = (e && e.code === "invalid_argument") ? "Saving is off for you here. Answer in chat." : "Not saved. Try again.";
      if (e && e.code === "invalid_argument") S.readOnly = true;
      render();
    });
  });
  render();
  return S.saving[d.id];
}
function pick(d, key, kind){
  var o = opt(d, key);
  return save(d, {choice_key:key, choice_label:o ? o.button : null, was_recommended:!!(o && o.recommended), kind:kind || "pick"});
}

/* ---------- send ---------- */
function sendText(){
  var proj = (S.meta && S.meta.project) || "pack";
  var parts = unsent().map(function(d){
    var r = resp(d), bits = [d.id];
    if (r.choice_key) bits.push(r.choice_key + (r.was_recommended ? " (my pick)" : ""));
    if (r.kind && r.kind !== "pick" && r.kind !== "ok_recommended") bits.push(r.kind.replace(/_/g," "));
    if (r.note && r.note.trim()) bits.push('note:"' + r.note.trim().replace(/\s+/g," ").slice(0,300) + '"');
    (r.regions||[]).forEach(function(g){ bits.push((g.callout_n ? "callout " + g.callout_n : "box") + " on " + g.shot_role + "-" + g.width); });
    if ((r.asset_ids||[]).length) bits.push(r.asset_ids.length + " image(s)");
    return bits.join(" ");
  });
  var t = "[decision-pack " + proj + "] " + parts.join(" · ");
  var enc = new TextEncoder();
  while (enc.encode(t).length > 4000) t = t.slice(0, -40);
  return t;
}
function refreshSendAnchor(){
  if (!S.comments || !S.comments.anchorFor) return;
  var el = document.getElementById("sendbar");
  if (!el || el.hidden) return;
  S.comments.anchorFor(el).then(function(a){ S.sendAnchor = a; }, function(){});
}
/* canSendToClaude() can change after load: watching Claude sessions are learned asynchronously.
   S.canSend is only a cache for the synchronous click path; it is re-checked (debounced) whenever the
   send bar shows unsent answers, on tab focus, and after a rejected send. */
function recheckSend(force){
  if (!S.comments || !S.comments.canSendToClaude) return;
  var now = Date.now();
  if (!force && (S.checkingSend || now - (S.sendCheckedAt || 0) < 4000)) return;
  S.checkingSend = true; S.sendCheckedAt = now;
  Promise.resolve().then(function(){ return S.comments.canSendToClaude(); }).then(function(v){
    S.checkingSend = false;
    if (v !== S.canSend){ S.canSend = v; render(); }
  }, function(){ S.checkingSend = false; });
}
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible" && unsent().length) recheckSend(true); });
function onSend(){
  var ds = unsent();
  if (!ds.length) return;
  if (S.canSend !== "available" || !S.comments || !S.sendAnchor){
    S.sentNote = "Saved. Claude picks these up next time it checks."; render(); return;
  }
  var p;
  try { p = S.comments.sendToClaude({anchor:S.sendAnchor, text:sendText()}); } catch(e){ p = Promise.reject(e); }
  p.then(function(){
    var now = new Date().toISOString();
    S.sentNote = "Sent " + ltTime(now) + ". Claude is on it.";
    var chain = Promise.resolve();
    ds.forEach(function(d){
      var r = Object.assign({}, resp(d), {sent_at:now});
      S.responses[d.id] = r;
      chain = chain.then(function(){ return S.db.doc("responses/" + d.id).set(r).catch(function(){}); });
    });
    render();
  }, function(e){
    S.sentNote = (e && e.code === "consent_required") ? "Not sent: allow commenting for this page, then press Send again." :
      "Saved. Claude picks these up next time it checks.";
    if (e && (e.code === "claude_unavailable" || e.code === "forbidden")){ S.canSend = "unknown"; S.sendCheckedAt = 0; }
    render();
    recheckSend(true);
  });
}

/* ---------- comments ---------- */
function anchorEl(anchor){
  var id = String(anchor||"").split(":")[0];
  var hot = document.querySelector('[data-anchor="' + CSS.escape(anchor) + '"]');

  var open = ds.filter(isOpen), closed = ds.filter(function(d){ return !isOpen(d); });
  if (S.changing){ var ch = ds.filter(function(d){ return d.id === S.changing; })[0]; if (ch && !isOpen(ch)){ closed = closed.filter(function(d){ return d !== ch; }); open = open.concat([ch]); } }
  document.getElementById("counts").textContent = S.loaded ? (open.length + " open · " + closed.length + " decided") : "Loading…";
  var nxt = open.filter(function(d){ return d.default_key && d.default_at && d.door === "two_way" && (!d.gate || d.gate === "none"); })
    .sort(function(a,b){ return a.default_at < b.default_at ? -1 : 1; })[0];
  document.getElementById("next").textContent = nxt ? (nxt.id + " goes with " + nxt.default_key + " " + tl(nxt, "default_at") + " if no answer") : "";
  var strip = document.getElementById("strip"); strip.textContent = "";
  ds.forEach(function(d){
    var r = unsynced(d);
    var cls = d.status === "moot" ? "moot" : !isOpen(d) ? "decided" : (r && hasAnswer(r)) ? "saved" : "";
    strip.appendChild(h("a", {href:"#d-" + d.id, "aria-label": d.id + ", " + (cls || "open")}, h("span", {"class":"dot " + cls}), d.id));
  });
  var takeable = open.filter(function(d){ return d.door === "two_way" && isOpen(d) && !(unsynced(d) && unsynced(d).choice_key); });
  var ta = document.getElementById("takeall");
  ta.hidden = S.readOnly || !takeable.length;
  ta.textContent = "Take all my picks (" + takeable.length + ")";
  ta.onclick = function(){ openTakeAll(takeable); };
  var dwa = (meta.done_without_asking || []);
  var done = document.getElementById("done"); done.textContent = "";
  if (dwa.length) done.appendChild(h("details", {"class":"done"}, h("summary", {text:"Done without asking (" + dwa.length + ")"}),
    h("ul", {"class":"plain"}, dwa.map(function(x){ return h("li", null, x.text + " — your words: “" + x.words + "”, " + tl(x, "date")); }))));
  var main = document.getElementById("cards");
  if (S.loaded || ds.length){
    main.textContent = "";
    if (!open.length && S.loaded) main.appendChild(h("p", {"class":"muted", text:"Nothing waiting on you here."}));
    open.forEach(function(d){ main.appendChild(card(d)); });
  }
  var fyi = meta.fyi || [];
  var fs = document.getElementById("fyi"); fs.hidden = !fyi.length;
  var fl = document.getElementById("fyilist"); fl.textContent = "";
  fyi.forEach(function(f){
    var img = h("img", {src:f.shot.src, alt:f.title, loading:"lazy"});
    img.addEventListener("click", function(){ openLightbox(f.shot.src, f.title); });
    fl.appendChild(h("figure", null, img, h("figcaption", {text:f.title})));
  });
  var lg = document.getElementById("log"); lg.hidden = !closed.length;
  var ll = document.getElementById("loglist"); ll.textContent = "";
  closed.slice().sort(function(a,b){ return ((b.outcome||{}).decided_at || "") < ((a.outcome||{}).decided_at || "") ? -1 : 1; })
    .forEach(function(d){ ll.appendChild(card(d)); });
  var un = unsent();
  var bar = document.getElementById("sendbar");
  bar.hidden = S.readOnly || (!un.length && !S.sentNote);
  document.getElementById("sendtext").textContent = un.length ? (un.length + (un.length === 1 ? " answer saved" : " answers saved")) +
    (S.canSend === "available" ? "" : " · Claude picks these up next time it checks") : (S.sentNote || "");
  var sb = document.getElementById("sendbtn");
  sb.hidden = !un.length || S.canSend !== "available";
  if (un.length && S.canSend !== "available") recheckSend(false);
  if (activeId){ var a2 = document.getElementById(activeId); if (a2 && a2 !== active){ a2.focus(); try { if (selS != null) a2.setSelectionRange(selS, selE); } catch(e){} } }
  if (S.openNote){ var n = document.getElementById("note-" + S.openNote); S.openNote = null; if (n && !activeId) n.focus({preventScroll:false}); }
  refreshSendAnchor();
  placeThreads();
}
function banner(text, err){
  var b = document.getElementById("banners");
  if ([].some.call(b.children, function(x){ return x.textContent === text; })) return;
  b.appendChild(h("p", {"class":"banner" + (err ? " err" : ""), role:"status", text:text}));
}
function deepLink(){
  var m = (location.hash || "").match(/^#d-([A-Za-z0-9-]+)$/);
  if (!m) return;
  var el = document.getElementById("d-" + m[1]);
  if (!el) return;
  el.scrollIntoView({block:"start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  document.querySelectorAll("article.card.hl").forEach(function(x){ x.classList.remove("hl"); });
  el.classList.add("hl");
  setTimeout(function(){ el.classList.remove("hl"); }, 4000);
}
window.addEventListener("hashchange", deepLink);
document.addEventListener("click", function(e){
  if (!S.commentMode || !S.ca) return;
  var t = e.target.closest && e.target.closest("[data-anchor], article.card");
  if (!t) return;
  e.preventDefault(); e.stopPropagation();
  var anchor = t.getAttribute("data-anchor") || t.id.replace(/^d-/, "");
  S.ca.compose(anchor, t, {label: anchor}).catch(function(){});
}, true);
window.addEventListener("resize", function(){ placeThreads(); });
document.getElementById("sendbtn").addEventListener("click", onSend);

function loaded(){ if (!S.loaded){ S.loaded = true; clearTimeout(S.timer); render(); deepLink(); } else render(); }
function failLoad(){ if (!S.loaded) banner("Could not load decisions. Reload, or tell Claude 'sync " + ((S.meta && S.meta.project) || "<project>") + "'.", true); }

function startLocal(p){
  S.meta = p.meta; (p.decisions||[]).forEach(function(d){ S.decisions[d.id] = d; });
  (p.responses||[]).forEach(function(r){ S.responses[r.decision_id] = r; });
  S.readOnly = true;
  banner("View only here. Reply in chat to answer.");
  loaded();
}
async function start(){
  if (window.DP_LOCAL_PACK) return startLocal(window.DP_LOCAL_PACK);
  S.timer = setTimeout(failLoad, TIMEOUT);
  if (!window.claude || !window.claude.use){ banner("View only here. Reply in chat to answer."); return; }
  var db = await window.claude.use("db");
  if (!db){ banner("View only here. Reply in chat to answer."); failLoad(); return; }
  S.db = db;
  var gotD = false, gotR = false;
  function maybe(){ if (gotD) loaded(); }
  db.doc("meta/pack").onSnapshot(function(s){ if (s.exists){ S.meta = s.data(); render(); } }, function(){});
  db.collection("decisions").onSnapshot(function(q){
    S.decisions = {}; q.docs.forEach(function(x){ S.decisions[x.id] = x.data(); });
    if (!q.metadata || !q.metadata.fromCache) gotD = true; else if (q.size) gotD = true;
    maybe();
  }, function(){ failLoad(); });
  db.collection("responses").onSnapshot(function(q){
    q.docs.forEach(function(x){ var cur = S.responses[x.id], nv = x.data(); if (!cur || !cur.answered_at || (nv.answered_at || "") >= cur.answered_at) S.responses[x.id] = nv; });
    gotR = true; if (S.loaded) render();
  }, function(){});
  var user = await window.claude.use("user");
  if (user){
    try { S.uid = await user.id(); } catch(e){}
    var owner = false; try { owner = await user.isOwner(); } catch(e){}
    S.readOnly = !owner;
    if (!owner) banner("View only here. Reply in chat to answer.");
  } else { S.readOnly = true; banner("View only here. Reply in chat to answer."); }
  render();
  try { S.assets = await window.claude.use("assets"); } catch(e){}
  var comments = null; try { comments = await window.claude.use("comments"); } catch(e){}
  S.comments = comments;
  if (comments){
    try { S.canSend = await comments.canSendToClaude(); } catch(e){ S.canSend = "off"; }
    if (comments.customAnchors){
      comments.customAnchors({
        mode:function(on){ S.commentMode = on; },
        threads:function(l){ S.threads = l || []; placeThreads(); },
        reveal:function(id){ var t = S.threads.filter(function(x){ return x.id === id; })[0]; var el = t && anchorEl(t.anchor); if (el) el.scrollIntoView({block:"center"}); placeThreads(); },
        composing:function(){}
      }).then(function(ca){ S.ca = ca; try { ca.placed({}); } catch(e){} render(); }, function(){ render(); });
    }
  }
  render();
}
render();
start();
})();
</script>
